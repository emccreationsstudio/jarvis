<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Jarvis Alarm</title>
<style>
  :root { --glow: #59c7ff; --accent: #40a6ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02060c; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }
  body {
    background:
      radial-gradient(circle at 50% 30%, rgba(89,199,255,.28), transparent 60%),
      linear-gradient(#02060c, #000);
    border: 1px solid rgba(89,199,255,.5); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
    -webkit-app-region: drag;
  }
  .ring { width: 86px; height: 86px; border-radius: 50%; position: relative; display: grid; place-items: center; }
  .ring::before, .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--glow); box-shadow: 0 0 24px var(--glow); animation: pulse 1s ease-out infinite; }
  .ring::after { animation-delay: .5s; }
  .ring span { font-size: 36px; animation: shake .5s ease-in-out infinite; }
  @keyframes pulse { from { transform: scale(.7); opacity: 1 } to { transform: scale(1.35); opacity: 0 } }
  @keyframes shake { 0%,100% { transform: rotate(-12deg) } 50% { transform: rotate(12deg) } }
  h1 { margin: 0; font-size: 22px; font-weight: 600; text-align: center; text-shadow: 0 0 12px rgba(89,199,255,.6); }
  p { margin: 0; color: rgba(255,255,255,.6); font: 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2px; }
  .buttons { display: flex; gap: 10px; width: 100%; -webkit-app-region: no-drag; }
  button { flex: 1; border: 1px solid var(--glow); color: #fff; border-radius: 999px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
           background: linear-gradient(var(--accent), #2471b8); box-shadow: 0 0 14px rgba(89,199,255,.5); }
  button.ghost { background: rgba(255,255,255,.08); box-shadow: none; border-color: rgba(255,255,255,.3); }
</style>
</head>
<body>
  <div class="ring"><span>⏰</span></div>
  <h1 id="title">Hatırlatma</h1>
  <p id="body"></p>
  <div class="buttons">
    <button class="ghost" id="snooze">10 dk ertele</button>
    <button id="done">Tamam</button>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const id = q.get("id");
  document.getElementById("title").textContent = q.get("title") || "Hatırlatma";
  document.getElementById("body").textContent = (q.get("body") || "").toLocaleUpperCase("tr-TR");

  // Alarm sesi: ısrarlı, yükselen bip (dosya gerekmez)
  const ctx = new AudioContext();
  let stopped = false;
  function beep(t, f) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.01); g.gain.linearRampToValueAtTime(0, t + 0.18);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.2);
  }
  function loop() {
    if (stopped) return;
    const t = ctx.currentTime + 0.05;
    [0, 0.25, 0.5, 0.75].forEach((d, i) => beep(t + d, i % 2 ? 1046 : 880));
    setTimeout(loop, 1600);
  }
  ctx.resume().then(loop);
  // 3 dakika sonra kendiliğinden ertele (sonsuza kadar çalmasın)
  setTimeout(() => act("snooze"), 180000);

  function act(action) {
    stopped = true;
    try { ctx.close(); } catch {}
    window.jarvis.alarmAction(id, action);
  }
  document.getElementById("done").onclick = () => act("done");
  document.getElementById("snooze").onclick = () => act("snooze");
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === "Escape") act("done"); });
</script>
</body>
</html>
